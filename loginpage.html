<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>WWTP Ceramic - Login</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    font-family:Arial,sans-serif;
    background:#eef2f7;
    color:#172033;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:16px;
    padding:30px;
    box-shadow:0 8px 25px #0002;
}

.logo{
    text-align:center;
    font-size:48px;
    margin-bottom:8px;
}

h1{
    text-align:center;
    color:#17365d;
    margin:0;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin:6px 0 28px;
    font-size:13px;
}

label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #c7d0dc;
    border-radius:8px;
    font-size:15px;
    margin-bottom:16px;
}

input:focus{
    outline:none;
    border-color:#1677c8;
}

.login-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#1677c8;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.login-btn:hover{
    background:#1265a9;
}

.error{
    display:none;
    background:#fff0f0;
    border:1px solid #ffc7c7;
    color:#b42318;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:15px;
}

.footer{
    text-align:center;
    color:#94a3b8;
    font-size:11px;
    margin-top:22px;
}
</style>
</head>

<body>

<div class="login-card">

    <div class="logo">🏭</div>

    <h1>WWTP CERAMIC</h1>

    <div class="subtitle">
        Engineering Dashboard V7.1
    </div>

    <form id="loginForm">

        <label>Email</label>

        <input
            id="email"
            type="email"
            placeholder="Masukkan email"
            required
        >

        <label>Password</label>

        <input
            id="password"
            type="password"
            placeholder="Masukkan password"
            required
        >

        <div id="error" class="error">
            Email atau password salah.
        </div>

        <button class="login-btn" type="submit">
            LOGIN
        </button>

    </form>

    <div class="footer">
        WWTP Ceramic • V7.1 Online
    </div>

</div>


<script>

/*
====================================================
LOGIN LOKAL SEMENTARA
====================================================

Login ini hanya untuk testing dashboard.

NANTI setelah Supabase normal,
bagian ini kita ganti dengan Supabase Auth.
*/

const USERS = [

    {
        email: "admin@wwtp.local",
        password: "wwtp123",
        role: "admin",
        name: "Admin WWTP"
    },

    {
        email: "operator@wwtp.local",
        password: "wwtp123",
        role: "operator",
        name: "Operator WWTP"
    }

];


document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    const user = USERS.find(function(u){

        return (
            u.email.toLowerCase() === email.toLowerCase()
            &&
            u.password === password
        );

    });


    if(!user){

        error.style.display = "block";

        return;

    }


    /*
    Simpan status login
    */

    localStorage.setItem(
        "wwtp_logged_in",
        "true"
    );


    localStorage.setItem(
        "wwtp_user",
        JSON.stringify({
            email:user.email,
            role:user.role,
            name:user.name
        })
    );


    /*
    Masuk ke dashboard
    */

    window.location.href = "dashboard.html";

});

</script>

</body>
</html>
